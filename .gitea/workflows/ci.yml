name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
          CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          pip install --no-cache-dir -r requirements-dev.txt
          # Internal-only deps: gmr-event-schemas + gmr-events live
          # in golden/* on Gitea. Clone with the read token; the
          # event-log trigger / dispatch route depend on these.
          tmpdir=$(mktemp -d)
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-event-schemas.git" \
              "$tmpdir/gmr-event-schemas"
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-events.git" \
              "$tmpdir/gmr-events"
          pip install --no-cache-dir "$tmpdir/gmr-event-schemas" "$tmpdir/gmr-events"
      - name: Unit tests
        run: python3 -m pytest tests/unit/ -q --cov=src --cov-report=xml:coverage.xml
      - name: Lint
        # Hard gate — pylint must rate 10.00/10. Tool config (justified
        # disables, pytest testpaths) lives in pyproject.toml.
        run: python3 -m pylint src/consolidator tests

  analyze:
    needs: test
    runs-on: python
    steps:
      - uses: actions/checkout@v4
      - name: Install + coverage
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
          CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          # Mirror the install steps from the `test` job: dev deps
          # (which include pytest-cov) plus the two internal-only
          # packages cloned from Gitea with CI_READ_TOKEN, then
          # run pytest with coverage so the Sonar scan has data.
          pip install --no-cache-dir -r requirements-dev.txt
          tmpdir=$(mktemp -d)
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-event-schemas.git" \
              "$tmpdir/gmr-event-schemas"
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-events.git" \
              "$tmpdir/gmr-events"
          pip install --no-cache-dir "$tmpdir/gmr-event-schemas" "$tmpdir/gmr-events"
          python3 -m pytest tests/unit/ -q --cov=src --cov-report=xml:coverage.xml || true
      - uses: actions/checkout@v4
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker
        run: curl -fsSL https://nexus.void42.internal/repository/docker-releases/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz --strip-components=1 -C /usr/local/bin docker/docker
      - name: Vendor internal Python deps for docker build
        # The Dockerfile pip-installs vendor/gmr-event-schemas + vendor/gmr-events.
        # pip's isolated-build env can't reach Gitea; we clone here at CI time
        # with CI_READ_TOKEN, then docker build copies them in.
        env:
          CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          mkdir -p vendor
          for repo in gmr-event-schemas gmr-events; do
              rm -rf "vendor/$repo"
              git clone --depth 1 \
                  "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/${repo}.git" \
                  "vendor/$repo"
              rm -rf "vendor/$repo/.git"
          done
      - name: Build and push image
        run: |
          TAG="v$(git rev-parse --short HEAD)"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea-http.dev-tools.svc.cluster.local:3000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker build --network host -t gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-consolidator:$TAG .
          docker push gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-consolidator:$TAG
      - name: Sign image with Cosign
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          curl -sL https://nexus.void42.internal/repository/github-releases/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          echo "$COSIGN_KEY" > /tmp/cosign.key
          cosign sign --key /tmp/cosign.key --yes --allow-http-registry gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-consolidator:$TAG
          rm /tmp/cosign.key
      - name: Attest CycloneDX SBOM
        # Bind a CycloneDX SBOM attestation so require-sbom-attestation passes
        # (this image was signed-but-unattested). cosign is already on PATH
        # from the sign step; requirements-based gen needs no dep compilation;
        # cosign v2.4.1 writes the legacy format Kyverno reads.
        env:
          COSIGN_PASSWORD: ""
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          # Runners reach PyPI only through the nexus proxy; without this pip
          # fails and (previously, sans set -e) the step passed silently.
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        # Best-effort: this must not break the deploy while the python-SBOM
        # tooling on the build runner is still being sorted out. The image is
        # already signed; a missing SBOM only shows in the (Audit) policy
        # report. Runs in a subshell so any failure is contained + warned.
        run: |
          (
            set -euo pipefail
            python3 -m pip install --break-system-packages --quiet --no-cache-dir cyclonedx-bom
            cyclonedx-py requirements requirements.txt --of json -o sbom.json
            test -s sbom.json
            echo "$COSIGN_KEY" > /tmp/cosign.key
            cosign attest --key /tmp/cosign.key --predicate sbom.json --type cyclonedx \
              --yes --allow-http-registry \
              gitea-http.dev-tools.svc.cluster.local:3000/fontem/fontem-consolidator:$TAG
            rm -f /tmp/cosign.key
          ) || echo "::warning::SBOM attestation failed — image signed but unattested (tracked in supply-chain rollout)"
      - name: Deploy to gitops (prod — singleton)
        run: |
          # Explicit ${USER}:${TOKEN}@ form; the OAuth2 scheme rejects
          # the registry deploy token even when the same combo works
          # for `docker login` to the gitea registry.
          git clone --depth=1 "http://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@gitea-http.dev-tools.svc.cluster.local:3000/fontem/gitops.git" /tmp/gitops
          cd /tmp/gitops
          sed -i 's/version: ".*"/version: "'$TAG'"/' prod/fontem-consolidator.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add prod/fontem-consolidator.yaml
          git diff --cached --quiet || git commit -m "ci: deploy fontem-consolidator $TAG"
          git push origin main
