name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
          CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          pip install --no-cache-dir -r requirements-dev.txt
          # Internal-only deps: gmr-event-schemas + gmr-events live
          # in golden/* on Gitea. Clone with the read token; the
          # event-log trigger / dispatch route depend on these.
          tmpdir=$(mktemp -d)
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-event-schemas.git" \
              "$tmpdir/gmr-event-schemas"
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-events.git" \
              "$tmpdir/gmr-events"
          pip install --no-cache-dir "$tmpdir/gmr-event-schemas" "$tmpdir/gmr-events"
      - name: Unit tests
        run: python3 -m pytest tests/unit/ -q --cov=src --cov-report=xml:coverage.xml
      - name: Lint
        # Hard gate — pylint must rate 10.00/10. Tool config (justified
        # disables, pytest testpaths) lives in pyproject.toml.
        run: python3 -m pylint src/consolidator tests

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - name: OSV-Scanner lockfile gate
        uses: ./.ci-actions/actions/osv-scan
      - name: Secret scan (gitleaks)
        uses: ./.ci-actions/actions/secret-scan

  analyze:
    needs: test
    runs-on: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, or SonarQube cannot date a line and treats the
          # whole project as new code: it then measures new-coverage and
          # new-violations over every file, and the gate fails on code
          # nobody in the PR touched. That is what happened here — a
          # trigger-only change was failed by new_coverage = 82.6 (the
          # project's overall figure) and three violations in files last
          # edited in April.
          fetch-depth: 0
      - name: Install + coverage
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
          CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          # Mirror the install steps from the `test` job: dev deps
          # (which include pytest-cov) plus the two internal-only
          # packages cloned from Gitea with CI_READ_TOKEN, then
          # run pytest with coverage so the Sonar scan has data.
          pip install --no-cache-dir -r requirements-dev.txt
          tmpdir=$(mktemp -d)
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-event-schemas.git" \
              "$tmpdir/gmr-event-schemas"
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-events.git" \
              "$tmpdir/gmr-events"
          pip install --no-cache-dir "$tmpdir/gmr-event-schemas" "$tmpdir/gmr-events"
          # No `|| true`: a failed suite leaves no coverage.xml, the scan
          # then runs without one, and SonarQube records no coverage at
          # all -- which passes any coverage condition, because a metric
          # with no value is skipped rather than failed.
          python3 -m pytest tests/unit/ -q --cov=src --cov-report=xml:coverage.xml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      - uses: ./.ci-actions/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  build-deploy:
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    runs-on: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}

      - name: Vendor internal Python deps for docker build
        # The Dockerfile pip-installs vendor/gmr-event-schemas + vendor/gmr-events.
        # pip's isolated-build env can't reach Gitea; clone them here at CI time
        # with CI_READ_TOKEN so `docker build` can COPY them into the build stage.
        env:
          CI_READ_TOKEN: ${{ secrets.CI_READ_TOKEN }}
        run: |
          rm -rf vendor && mkdir -p vendor
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-event-schemas.git" \
              vendor/gmr-event-schemas
          git clone --depth 1 \
              "http://lucid:${CI_READ_TOKEN}@contribute.void42.internal/fontem/fontem-events.git" \
              vendor/gmr-events
          rm -rf vendor/gmr-event-schemas/.git vendor/gmr-events/.git

      - id: image
        name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-consolidator
          vault-role-id: ${{ secrets.VAULT_SIGNER_ROLE_ID }}
          vault-secret-id: ${{ secrets.VAULT_SIGNER_SECRET_ID }}
          sbom-coverage: enforce
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          # No shell, package manager or pip in the runtime image: fail the
          # build if one comes back (e.g. with a new base).
          minimal-enforce: "true"

      - name: Deploy to gitops (shared — singleton)
        # Consolidator's only ArgoCD-managed instance is the fontem-shared one
        # (fontem-prod is held at 0 replicas and bumped manually via
        # fontem-prod-release). Deployed by exactly ONE app: the
        # `fontem-consolidator` chart app, image from `version:` in
        # shared/fontem-consolidator.yaml. The raw manifests that used to
        # duplicate the three deployments in infra/shared.yaml are gone —
        # the two selfHealing apps disagreed about kube-monkey label
        # placement and ping-ponged the objects forever (2026-08-28 sweep),
        # so this step no longer writes infra/shared.yaml. (The previous
        # target `prod/fontem-consolidator.yaml` never existed, which
        # failed every build 795-812 and left the image un-rolled.)
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          # Explicit ${USER}:${TOKEN}@ form; the OAuth2 scheme rejects the
          # registry deploy token even when the same combo works for docker login.
          git clone --depth=1 \
            "http://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@contribute.void42.internal/fontem/gitops.git" \
            /tmp/gitops
          cd /tmp/gitops
          # Fail loud if the target ever moves rather than silently no-op.
          test -f shared/fontem-consolidator.yaml
          sed -i 's/version: ".*"/version: "'"$TAG"'"/' shared/fontem-consolidator.yaml
          git config user.name "GMR CI"
          git config user.email "ci@void42.internal"
          git add shared/fontem-consolidator.yaml
          git diff --cached --quiet || git commit -m "ci: deploy fontem-consolidator $TAG to fontem-shared"
          git push origin main
