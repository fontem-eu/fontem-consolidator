{{- /*
consolidator-trigger — gmr-events EventConsumer that POSTs each
input event to the consolidator's /events/dispatch endpoint after
the Neo4j sink has projected it.

Same image as the API pod, different entrypoint. Cycle prevention
is in the consumer (INPUT_TYPES filter): the consolidator's own
outputs (AssertSameAs / RetractSameAs) are skipped, so the trigger
never re-dispatches its own writes.

Single replica — ordering matters and the offset table is per
consumer-name.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: consolidator-trigger
  labels:
    app: consolidator-trigger
    component: event-consumer
spec:
  # Single replica by default — one event consumer per offset row in
  # events.consumer_offsets. Set `triggerReplicas: 0` in prod overlays
  # to pause the consumer during storage migrations / replays without
  # touching the rest of the chart.
  #
  # `| default 1` would treat 0 as falsy (helm gotcha), so use an
  # explicit nil check instead — only fall back to 1 when the key is
  # unset, accept 0 when explicitly set.
  replicas: {{ if hasKey .Values "triggerReplicas" }}{{ .Values.triggerReplicas }}{{ else }}1{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: consolidator-trigger
  template:
    metadata:
      labels:
        app: consolidator-trigger
        component: event-consumer
      annotations:
        # Sinks/triggers run under linkerd-disabled like virtuoso/neo4j
        # (data-tier exemption — long-running connections to Postgres).
        linkerd.io/inject: disabled
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: trigger
          image: contribute.void42.internal/golden/gmr-consolidator:{{ .Values.version }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.consolidator.trigger"]
          ports:
            - containerPort: 9100
              name: metrics
          env:
            - name: EVENT_CONSUMER_NAME
              value: consolidator_trigger
            # Gate on the Neo4j sink — the consolidator queries
            # Neo4j (resolver, fulltext, vector, GDS) so the new
            # entity must be present before we dispatch it.
            - name: EVENT_UPSTREAM_CONSUMER
              value: neo4j_sink
            - name: EVENTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gmr-postgres-credentials
                  key: EVENTS_DATABASE_URL
            # Address the consolidator in the same namespace this chart is
            # installed into. The previous hardcode (`gmr.svc.cluster.local`)
            # broke real prod's deployment — fontem-prod's trigger would
            # have dispatched to the *staging* consolidator (which talks
            # to staging's Neo4j) instead of its co-located prod sibling.
            - name: CONSOLIDATOR_URL
              value: http://gmr-consolidator.{{ .Release.Namespace }}.svc.cluster.local:8000
            # HTTP read timeout for the dispatch round-trip. Default
            # 180s — consolidate() runs the resolver's fulltext +
            # vector + GDS pipeline against Neo4j, which under cold
            # cache or concurrent load can exceed the 60s httpx
            # default. Tunable via triggerHttpTimeout.
            - name: CONSOLIDATOR_HTTP_TIMEOUT
              value: "{{ .Values.triggerHttpTimeout | default 180 }}"
            # Bounded fan-out: each batch is dispatched through a
            # thread pool. Size is per-batch, so the upper bound on
            # in-flight POSTs to gmr-consolidator at any moment is
            # this value. Resolver + Neo4j are the bottleneck;
            # pick higher only when Neo4j has the cache + tx-timeout
            # budget for it (current values: 2g pagecache, 90s tx
            # timeout, 512m per-tx memory cap).
            - name: CONSOLIDATOR_TRIGGER_CONCURRENCY
              value: "{{ .Values.triggerConcurrency | default 3 }}"
            # Batch size matches concurrency by default. The
            # EventConsumer commits offset once per batch, so with
            # ~10s of work per consolidate(), batch=N means a commit
            # every (N / concurrency) × 10s. Setting batch=concurrency
            # keeps that to one commit per ~10s — offset progress
            # tracks real work, and a pod crash never costs more
            # than ``concurrency`` reprocessed events.
            - name: EVENT_BATCH_SIZE
              value: "{{ .Values.triggerBatchSize | default .Values.triggerConcurrency | default 3 }}"
            - name: KUMA_PUSH_URL
              valueFrom:
                secretKeyRef:
                  name: etl-kuma-push-urls
                  key: consolidator-trigger
                  optional: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          readinessProbe:
            httpGet: { path: /metrics, port: 9100 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /metrics, port: 9100 }
            periodSeconds: 30
            failureThreshold: 3
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  name: consolidator-trigger
  labels:
    app: consolidator-trigger
spec:
  selector:
    app: consolidator-trigger
  ports:
    - { name: metrics, port: 9100, targetPort: 9100 }
