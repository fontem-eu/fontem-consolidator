apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: fontem-consolidator
  labels:
    app: fontem-consolidator
    {{- if .Values.chaos }}{{- if .Values.chaos.enabled }}
    # kube-monkey reads these from the Deployment's own labels. They lived on
    # the pod template for months, where kube-monkey never looks, so nothing
    # was ever eligible — the monkey looked armed and killed nothing.
    #
    # Off unless a values file turns it on. Production inherits this same
    # chart, and a label that opts a workload into being killed has no
    # business defaulting to on.
    kube-monkey/enabled: enabled
    kube-monkey/identifier: fontem-consolidator
    kube-monkey/mtbf: {{ .Values.chaos.mtbf | default 2 | quote }}
    kube-monkey/kill-mode: fixed
    kube-monkey/kill-value: "1"
    # Read by the chaos runner's richer faults, which select on this alone.
    chaos/eligible: "true"
    {{- end }}{{- end }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fontem-consolidator
  template:
    metadata:
      labels:
        app: fontem-consolidator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: fontem-consolidator
          image: contribute.void42.internal/fontem/fontem-consolidator:{{ .Values.version }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: CONSOLIDATOR_AUTO_MERGE_ENABLED
              value: "{{ .Values.autoMergeEnabled }}"
            - name: CONSOLIDATOR_LINGUISTICS_URL
              value: "{{ .Values.linguisticsUrl | default "http://fontem-linguistics.linguistics-service.svc.cluster.local:8080" }}"
            - name: CONSOLIDATOR_NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_URI
            - name: CONSOLIDATOR_NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: CONSOLIDATOR_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD
            {{- if .Values.eventEmitEnabled }}
            # Emits AssertSameAs into events.entity_events — the only route
            # SAME_AS decisions have to the virtuoso sink, and what makes
            # consolidation output replayable.
            #
            # Gated because enabling it took prod's Postgres down on
            # 2026-09-02: EventLog holds one connection, this pod emits
            # through asyncio.to_thread, and psycopg's transaction() is not
            # re-entrant across threads on a shared connection — concurrent
            # entries became orphaned SAVEPOINTs whose ExclusiveLocks were
            # never released, filling the lock table. Fixed in
            # fontem-events 0.5.1 by serialising batch().
            #
            # The flag exists so the fix can be soaked in fontem-shared
            # before prod turns it on; the two environments share this chart
            # and would otherwise move together.
            - name: EVENTS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fontem-postgres-credentials
                  key: EVENTS_DATABASE_URL
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
