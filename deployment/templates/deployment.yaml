apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: fontem-consolidator
  labels:
    app: fontem-consolidator
spec:
  replicas: {{ .Values.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fontem-consolidator
  template:
    metadata:
      labels:
        app: fontem-consolidator
        kube-monkey/enabled: enabled
        kube-monkey/identifier: fontem-consolidator
        kube-monkey/mtbf: "2"
        kube-monkey/kill-mode: fixed
        kube-monkey/kill-value: "1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: fontem-consolidator
          image: contribute.void42.internal/fontem/fontem-consolidator:{{ .Values.version }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: CONSOLIDATOR_AUTO_MERGE_ENABLED
              value: "{{ .Values.autoMergeEnabled }}"
            - name: CONSOLIDATOR_NEO4J_URI
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_URI
            - name: CONSOLIDATOR_NEO4J_USER
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_USER
            - name: CONSOLIDATOR_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: NEO4J_PASSWORD
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
